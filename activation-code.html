  --q-card: var(--q-neutral-800);
  --q-card-foreground: var(--q-neutral-0);

  --surface-2: var(--q-neutral-700);
  --ink: var(--q-foreground);
  --ink-2: var(--q-neutral-300);
  --ink-3: var(--q-neutral-400);
  --line: var(--q-border);
  --brand: var(--q-primary);
  --brand-ink: var(--q-primary-foreground);
  --state-success: var(--q-state-success);
  --state-warning: var(--q-state-warning);
  --state-error: var(--q-state-error);
  --state-info: var(--q-state-info);
  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-pill: 999px;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.2), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.4);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

@theme inline {
  --color-background: var(--q-background);
  --color-foreground: var(--q-foreground);
  --color-card: var(--q-card);
  --color-card-foreground: var(--q-card-foreground);
  --color-popover: var(--q-popover);
  --color-popover-foreground: var(--q-popover-foreground);
  --color-primary: var(--q-primary);
  --color-primary-foreground: var(--q-primary-foreground);
  --color-secondary: var(--q-secondary);
  --color-secondary-foreground: var(--q-secondary-foreground);
  --color-muted: var(--q-muted);
  --color-muted-foreground: var(--q-muted-foreground);
  --color-accent: var(--q-accent);
  --color-accent-foreground: var(--q-accent-foreground);
  --color-border: var(--q-border);
  --color-input: var(--q-input);
  --color-ring: var(--q-ring);
  --radius-sm: var(--q-radius-small);
  --radius-md: var(--q-radius-medium);
  --radius-lg: var(--q-radius-large);
  --radius-full: var(--q-radius-full);
}

/* Base typography */
html,
body {
  font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background-color: var(--q-background);
  color: var(--q-foreground);
  -webkit-font-smoothing: antialiased;
}

.font-mono {
  font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
  font-variant-numeric: tabular-nums;
}

/* Safe area helpers for mobile mockups */
.safe-top {
  padding-top: env(safe-area-inset-top, 0px);
}

.safe-bottom {
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* Gradient accents (same-hue only) */
.brand-gradient {
  background: linear-gradient(135deg, var(--q-primary-500) 0%, var(--q-primary-700) 100%);
}

/* Custom scrollbar for desktop preview */
::-webkit-scrollbar {
  width: 4px;
}

::-webkit-scrollbar-thumb {
  background: var(--q-neutral-600);
  border-radius: 2px;
}

<script id="theme-controller">
(function(){
  var root = document.documentElement;
  var KEY = 'app-theme';
  function applyTheme(theme) {
    if (theme === 'light') {
      root.classList.add('light');
      root.classList.remove('dark');
    } else {
      root.classList.add('dark');
      root.classList.remove('light');
    }
  }
  function updateLabel(theme) {
    document.querySelectorAll('[data-theme-label]').forEach(function(el){
      el.textContent = theme === 'light' ? '浅色' : '深色';
    });
  }
  function readTheme() {
    var v = null;
    try { v = sessionStorage.getItem(KEY); } catch(e) {}
    if (!v) { try { v = localStorage.getItem(KEY); } catch(e) {} }
    return v === 'light' ? 'light' : 'dark';
  }
  function writeTheme(theme) {
    try { sessionStorage.setItem(KEY, theme); } catch(e) {}
    try { localStorage.setItem(KEY, theme); } catch(e) {}
    var d = new Date();
    d.setTime(d.getTime() + 365*24*60*60*1000);
    try { document.cookie = KEY + '=' + theme + ';path=/;expires=' + d.toUTCString(); } catch(e) {}
  }
  var current = readTheme();
  applyTheme(current);
  updateLabel(current);
  window.toggleAppTheme = function() {
    var next = root.classList.contains('light') ? 'dark' : 'light';
    applyTheme(next);
    updateLabel(next);
    writeTheme(next);
  };
  window.addEventListener('storage', function(e) {
    if (e.key === KEY && e.newValue) {
      applyTheme(e.newValue);
      updateLabel(e.newValue);
    }
  });
})();
</script>

    <script>
  document.addEventListener('DOMContentLoaded', function(){ lucide.createIcons(); });
  (function () {
    var BASE = '2026-09-18';
    var modal = document.getElementById('renew-modal');
    var openBtn = document.querySelector('[data-dom-id="activation-renew-btn"]');
    var closeBtn = document.getElementById('renew-close');
    var confirmBtn = document.getElementById('renew-confirm');
    var projected = document.getElementById('renew-projected');
    var tiers = document.querySelectorAll('.renew-tier');
    var selectedDays = 0;
    function fmt(d) {
      var y = d.getFullYear(), m = ('0' + (d.getMonth() + 1)).slice(-2), day = ('0' + d.getDate()).slice(-2);
      return y + '-' + m + '-' + day;
    }
    function open() { modal.classList.remove('hidden'); modal.classList.add('flex'); }
    function close() { modal.classList.add('hidden'); modal.classList.remove('flex'); }
    if (openBtn) openBtn.addEventListener('click', open);
    if (closeBtn) closeBtn.addEventListener('click', close);
    if (modal) modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
    tiers.forEach(function (t) {
      t.addEventListener('click', function () {
        tiers.forEach(function (x) { x.classList.remove('border-[#00d4aa]', 'text-brand'); });
        t.classList.add('border-[#00d4aa]', 'text-brand');
        selectedDays = parseInt(t.getAttribute('data-days'), 10);
        var base = new Date(BASE + 'T00:00:00');
        base.setDate(base.getDate() + selectedDays);
        projected.textContent = fmt(base);
        confirmBtn.disabled = false;
      });
    });
    if (confirmBtn) confirmBtn.addEventListener('click', function () {
      if (!selectedDays) return;
      close();
    });
  })();
  </script>
