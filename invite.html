<script id="theme-controller">
(function(){
  var root = document.documentElement;
  var KEY = 'app-theme';
  function applyTheme(theme) {
    if (theme === 'light') {
      root.classList.add('light');
      root.classList.remove('dark');
    } else {
      root.classList.add('dark');
      root.classList.remove('light');
    }
  }
  function updateLabel(theme) {
    document.querySelectorAll('[data-theme-label]').forEach(function(el){
      el.textContent = theme === 'light' ? '浅色' : '深色';
    });
  }
  function readTheme() {
    var v = null;
    try { v = sessionStorage.getItem(KEY); } catch(e) {}
    if (!v) { try { v = localStorage.getItem(KEY); } catch(e) {} }
    return v === 'light' ? 'light' : 'dark';
  }
  function writeTheme(theme) {
    try { sessionStorage.setItem(KEY, theme); } catch(e) {}
    try { localStorage.setItem(KEY, theme); } catch(e) {}
    var d = new Date();
    d.setTime(d.getTime() + 365*24*60*60*1000);
    try { document.cookie = KEY + '=' + theme + ';path=/;expires=' + d.toUTCString(); } catch(e) {}
  }
  var current = readTheme();
  applyTheme(current);
  updateLabel(current);
  window.toggleAppTheme = function() {
    var next = root.classList.contains('light') ? 'dark' : 'light';
    applyTheme(next);
    updateLabel(next);
    writeTheme(next);
  };
  window.addEventListener('storage', function(e) {
    if (e.key === KEY && e.newValue) {
      applyTheme(e.newValue);
      updateLabel(e.newValue);
    }
  });
})();
</script>
